<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/src/main.js" defer></script>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <title>AEON</title>
  </head>

  <body>
    <header>
      <h1>AEON</h1>
    </header>
    <main>
      <div class="left-side">
        <h2>Projects</h2>
        <nav id="projects"></nav>
        <div>
          <form id="add-project" class="add-project">
            <input
              type="text"
              id="project-input"
              placeholder="new project"
              required
            />
            <button class="add proj" type="submit" name="add" value="add">
              +
            </button>
            <button
              class="cancel proj"
              type="submit"
              name="cancel"
              value="cancel"
              formnovalidate
            >
              x
            </button>
          </form>
        </div>
        <div class="project-actions">
          <button
            id="edit-projects"
            name="edit-projects"
            value="edit-projects"
            type="button"
          >
            Edit Projects
          </button>
        </div>
      </div>
      <div class="content">
        <div class="list-container">
          <div id="tasks" class="task-list"></div>
          <form id="add-task" class="add-task">
            <input
              type="text"
              id="todo-input"
              placeholder="add new task"
              required
            />
            <div class="todo-buttons">
              <button class="add todo" type="submit" name="add" value="add">
                Add
              </button>
              <button
                class="cancel todo"
                type="submit"
                name="cancel"
                value="cancel"
                formnovalidate
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <div id="modal-container" popover></div>
  </body>
</html>
